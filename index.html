<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Расписание">
<meta name="theme-color" content="#12302C">
<style>
:root{
  --ink:#12302C; --ink2:#1C4640; --amber:#F0A93B; --amber-ink:#3A2600;
  --bg:#EEF2F0; --card:#FFFFFF; --text:#13201E; --muted:#5E716D; --line:#D9E1DE; --danger:#B3402F;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0C1917; --card:#14251F; --text:#E7EFEC; --muted:#8FA39E; --line:#223A34; --danger:#E57B69}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header{background:var(--ink);color:#fff;padding:calc(var(--sat) + 12px) 16px 10px;flex:none}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
.status{font-size:12px;opacity:.75;white-space:nowrap}
.status.off{color:var(--amber);opacity:1}
.days{display:flex;gap:6px;margin-top:10px}
.day{flex:1;border:0;background:var(--ink2);color:#fff;border-radius:12px;padding:6px 0 7px;text-align:center;min-width:0}
.day small{display:block;font-size:11px;opacity:.7}
.day b{font-size:17px;font-weight:600}
.day.today b{text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:3px}
.day.sel{background:var(--amber);color:var(--amber-ink)}
.day.sel small{opacity:.8}
main{flex:1;overflow-y:auto;padding:14px 14px 20px;-webkit-overflow-scrolling:touch}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 10px}
.dayhead h2{margin:0;font-size:19px}
.dayhead span{color:var(--muted);font-size:14px}
.lesson{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.t{flex:none;width:54px;text-align:right;font-variant-numeric:tabular-nums}
.t b{display:block;font-size:20px;line-height:1.1}
.t small{color:var(--muted);font-size:13px}
.body{flex:1;min-width:0}
.subj{font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:14px;margin-top:2px}
.badge{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;background:var(--amber);color:var(--amber-ink);border-radius:8px;padding:1px 8px}
.lesson.cx{opacity:.6}
.lesson.cx .subj{text-decoration:line-through}
.cxl{color:var(--danger);font-size:13px;font-weight:600;margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.empty b{display:block;font-size:18px;color:var(--text);margin-bottom:4px}
nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav button{flex:1;border:0;background:none;padding:11px 0;color:var(--muted);font-weight:600;font-size:15px}
nav button.on{color:var(--text);box-shadow:inset 0 3px 0 var(--amber)}
nav i{font-style:normal;background:var(--amber);color:var(--amber-ink);border-radius:9px;font-size:12px;padding:0 6px;margin-left:4px}
.group{margin:0 2px 6px;color:var(--muted);font-size:13px;font-weight:600}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.note input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--ink2)}
.note .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.note.done .tx{text-decoration:line-through;color:var(--muted)}
.note .sub{font-size:12px;color:var(--muted);margin-top:2px}
.tag{font-size:11px;font-weight:700;background:var(--ink2);color:#fff;border-radius:6px;padding:0 5px;margin-right:4px}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0 2px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:16px 0;display:block;margin:0 auto;font-size:14px}
.screen{padding:calc(var(--sat) + 40px) 22px 30px;max-width:520px;margin:0 auto;overflow-y:auto;height:100%}
.screen h1{font-size:26px;margin:0 0 6px}
.screen p{color:var(--muted);margin:0 0 14px}
.screen ol{padding-left:20px;margin:0 0 18px;line-height:1.7}
.field{width:100%;font-size:22px;letter-spacing:3px;text-transform:uppercase;text-align:center;padding:13px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.field:focus{outline:none;border-color:var(--amber)}
.btn{width:100%;margin-top:12px;border:0;border-radius:12px;padding:14px;font-weight:700;background:var(--amber);color:var(--amber-ink);font-size:17px}
.err{color:var(--danger);margin-top:10px;font-size:14px;min-height:20px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px 14px calc(var(--sab) + 14px);max-height:85%;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 2px;font-size:18px}
.sheet .meta{margin-bottom:12px}
textarea{width:100%;min-height:76px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px;resize:none}
textarea:focus{outline:2px solid var(--amber)}
.row{display:flex;gap:10px;align-items:center;margin-top:10px}
.row label{flex:1;display:flex;gap:8px;align-items:center}
.row label input{width:20px;height:20px;accent-color:var(--ink2)}
.row .btn{width:auto;margin:0;padding:10px 20px;font-size:16px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WDF=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function makeId(){try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}let s='';for(let i=0;i<32;i++)s+=Math.floor(Math.random()*16).toString(16);return s}
let device=LS.get('device',null);
if(!device){device=makeId();LS.set('device',device)}
const hdr=(t)=>({Authorization:'Bearer '+t,'X-Device':device});
const standalone=()=>window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
const DEVMSG='Этот код уже привязан к другому устройству. Получите новый код в боте и введите его в установленном приложении.';
let token=LS.get('token',null);
let data=LS.get('data',null);      // последнее загруженное расписание (для работы без интернета)
let notes=LS.get('notes',[]);      // заметки и ДЗ: только на этом телефоне
let state={tab:'sch',sel:null,offline:false,expired:false,syncedAt:LS.get('syncedAt',0),err:''};

// --- Дата по Ташкенту
function today(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tashkent',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const [y,m,d]=p.split('-').map(Number);
  return new Date(Date.UTC(y,m-1,d));
}
const wdOf=(d)=>(d.getUTCDay()+6)%7;
function weekDates(){
  const t=today(), wd=wdOf(t);
  const mon=new Date(t); mon.setUTCDate(t.getUTCDate()+(wd===6?1:-wd)); // в воскресенье показываем следующую неделю
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setUTCDate(mon.getUTCDate()+i);return d});
}
const isoOf=(d)=>d.toISOString().slice(0,10);
const startMin=(s)=>{const m=/^(\d+):(\d+)/.exec(s||'');return m?(+m[1])*60+(+m[2]):99999};

// --- Синхронизация
async function sync(){
  if(!token) return;
  try{
    const r=await fetch('/api/schedule',{headers:hdr(token),cache:'no-store'});
    if(r.status===403){token=null;LS.set('token',null);state.err=DEVMSG;return render()}
    if(r.status===401){token=null;LS.set('token',null);state.err='Код больше не действует. Получите новый в боте.';return render()}
    if(r.status===402){state.expired=true;state.offline=false;return render()}
    if(!r.ok) throw new Error(r.status);
    data=await r.json(); LS.set('data',data);
    state.expired=false; state.offline=false; state.syncedAt=Date.now(); LS.set('syncedAt',state.syncedAt);
  }catch(e){ state.offline=true }
  render();
}

async function login(code){
  code=(code||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length<8){state.err='Введите код из бота полностью';return render()}
  token=code; state.err='';
  const r=await fetch('/api/schedule',{headers:hdr(code),cache:'no-store'}).catch(()=>null);
  if(!r){token=null;state.err='Нет интернета. Для первого входа он нужен.';return render()}
  if(r.status===403){token=null;state.err=DEVMSG;return render()}
  if(r.status===401){token=null;state.err='Код не подошёл. Проверьте его или получите новый в боте.';return render()}
  LS.set('token',token);
  if(r.status===402){state.expired=true;return render()}
  if(!r.ok){token=null;state.err='Ошибка сервера, попробуйте позже.';return render()}
  data=await r.json(); LS.set('data',data);
  state.syncedAt=Date.now(); LS.set('syncedAt',state.syncedAt); state.expired=false; render();
}

function logout(){
  if(!confirm('Выйти? Заметки останутся на телефоне.')) return;
  token=null; data=null; LS.set('token',null); LS.set('data',null); render();
}

// --- Заметки
const saveNotes=()=>LS.set('notes',notes);
const openCount=()=>notes.filter(n=>!n.done).length;
function addNote(subject,text,hw,date){
  text=text.trim(); if(!text) return;
  notes.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),subject,text,hw,done:false,date});
  saveNotes();
}

// --- Экраны
function renderInstall(){
  $('#app').innerHTML=`<div class="screen">
    <h1>Сначала добавьте на экран Домой</h1>
    <p>Код входа привязывается к устройству. Чтобы он не привязался к браузеру, а не к приложению, установите приложение сначала.</p>
    <ol>
      <li>Нажмите «Поделиться» в Safari.</li>
      <li>Выберите «На экран Домой».</li>
      <li>Откройте приложение с экрана и введите код из бота.</li></ol>
    <button class="link" id="fl">Войти без установки</button></div>`;
  $('#fl').onclick=()=>{state.forceLogin=true;render()};
}
function renderLogin(){
  if(!standalone()&&!state.forceLogin&&!state.err) return renderInstall();
  $('#app').innerHTML=`<div class="screen">
    <h1>Расписание Губкин</h1>
    <p>Приложение работает вместе с Telegram-ботом и доступно по подписке.</p>
    <ol>
      <li>Откройте бота и нажмите «📱 Приложение».</li>
      <li>Скопируйте код, который пришлёт бот.</li>
      <li>Вставьте его сюда.</li>
    </ol>
    <input class="field" id="code" placeholder="КОД ИЗ БОТА" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="14">
    <button class="btn" id="go">Войти</button>
    <div class="err">${esc(state.err)}</div></div>`;
  $('#go').onclick=()=>login($('#code').value);
  $('#code').onkeydown=(e)=>{if(e.key==='Enter')login(e.target.value)};
}

function renderExpired(){
  $('#app').innerHTML=`<div class="screen">
    <h1>Подписка закончилась</h1>
    <p>Продлите её в боте: раздел «💳 Подписка». После оплаты откройте приложение снова, всё включится само.</p>
    <button class="btn" id="re">Проверить ещё раз</button>
    <button class="link" id="lo">Выйти</button></div>`;
  $('#re').onclick=sync; $('#lo').onclick=logout;
}

function lessonsFor(wd){
  const list=(data&&data.week&&data.week[String(wd)])||[];
  return list.slice().sort((a,b)=>startMin(a.time)-startMin(b.time)||(a.cancelled-b.cancelled));
}

function statusText(){
  if(state.offline) return state.syncedAt?'без интернета · данные от '+new Date(state.syncedAt).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}):'без интернета';
  return state.syncedAt?'обновлено '+new Date(state.syncedAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'загрузка…';
}

function renderSchedule(){
  const dates=weekDates(), t=today(), twd=wdOf(t);
  if(state.sel===null) state.sel=twd===6?0:twd;
  const shown=dates.filter((d,i)=>i<6||lessonsFor(6).length);
  const chips=shown.map(d=>{
    const i=wdOf(d);
    return `<button class="day ${i===state.sel?'sel':''} ${isoOf(d)===isoOf(t)?'today':''}" data-i="${i}"><small>${WD[i]}</small><b>${d.getUTCDate()}</b></button>`;
  }).join('');
  const d=dates[state.sel], list=lessonsFor(state.sel), iso=isoOf(d);
  const active=list.filter(l=>!l.cancelled).length;
  const word=(n)=>n%10===1&&n%100!==11?'пара':([2,3,4].includes(n%10)&&![12,13,14].includes(n%100)?'пары':'пар');
  const cards=list.map((l,k)=>{
    const [a,b]=(l.time||'').split('-');
    const cnt=notes.filter(n=>n.subject===l.subject&&!n.done).length;
    const meta=[l.type,l.room?'ауд. '+l.room:''].filter(Boolean).join(' · ');
    return `<button class="lesson ${l.cancelled?'cx':''}" data-k="${k}">
      <div class="t"><b>${esc(a||'—')}</b><small>${esc(b||'')}</small></div>
      <div class="body"><div class="subj">${esc(l.subject)}</div>
      <div class="meta">${esc(meta)}${l.teacher?'<br>'+esc(l.teacher):''}${l.subgroup?'<br>подгруппа '+l.subgroup:''}</div>
      ${l.cancelled?'<div class="cxl">Пара отменена</div>':''}
      ${cnt?`<span class="badge">заметок: ${cnt}</span>`:''}</div></button>`;
  }).join('');
  $('#app').innerHTML=`
    <header><div class="top"><h1>${esc(data.group)}</h1><span class="status ${state.offline?'off':''}">${esc(statusText())}</span></div>
    <div class="days">${chips}</div></header>
    <main><div class="dayhead"><h2>${WDF[state.sel]}</h2><span>${d.getUTCDate()} ${MON[d.getUTCMonth()]}${list.length?' · '+active+' '+word(active):''}</span></div>
    ${cards||'<div class="empty"><b>Пар нет</b>Можно выдохнуть</div>'}</main>${tabs()}`;
  document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{state.sel=+b.dataset.i;render()});
  document.querySelectorAll('.lesson').forEach(b=>b.onclick=()=>openSheet(list[+b.dataset.k],iso,d));
  bindTabs();
}

function tabs(){
  const c=openCount();
  return `<nav><button data-t="sch" class="${state.tab==='sch'?'on':''}">Расписание</button>
  <button data-t="notes" class="${state.tab==='notes'?'on':''}">Заметки${c?`<i>${c}</i>`:''}</button></nav>`;
}
function bindTabs(){document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;render()})}

function renderNotes(){
  const open=notes.filter(n=>!n.done), done=notes.filter(n=>n.done);
  const row=(n)=>`<div class="note ${n.done?'done':''}">
    <input type="checkbox" data-id="${n.id}" ${n.done?'checked':''} aria-label="Готово">
    <div class="tx">${n.hw?'<span class="tag">ДЗ</span>':''}${esc(n.text)}<div class="sub">${esc(n.subject)}${n.date?' · пара '+n.date.split('-').reverse().slice(0,2).join('.'):''}</div></div>
    <button class="x" data-del="${n.id}" aria-label="Удалить">×</button></div>`;
  $('#app').innerHTML=`
    <header><div class="top"><h1>Заметки и ДЗ</h1><span class="status">только на этом телефоне</span></div></header>
    <main>
      ${open.length?`<div class="group">Нужно сделать</div>`+open.map(row).join(''):'<div class="empty"><b>Пока пусто</b>Откройте пару в расписании и добавьте заметку или ДЗ</div>'}
      ${done.length?`<div class="group" style="margin-top:14px">Готово</div>`+done.map(row).join(''):''}
      <button class="link" id="lo">Выйти из приложения</button>
    </main>${tabs()}`;
  document.querySelectorAll('.note input').forEach(c=>c.onchange=()=>{const n=notes.find(x=>x.id===c.dataset.id);if(n){n.done=c.checked;saveNotes();render()}});
  document.querySelectorAll('.x').forEach(b=>b.onclick=()=>{notes=notes.filter(x=>x.id!==b.dataset.del);saveNotes();render()});
  $('#lo').onclick=logout; bindTabs();
}

function openSheet(lesson,iso,d){
  const ex=()=>notes.filter(n=>n.subject===lesson.subject);
  const bg=document.createElement('div'); bg.className='sheet-bg';
  const draw=()=>{
    bg.innerHTML=`<div class="sheet"><h3>${esc(lesson.subject)}</h3>
      <div class="meta">${WDF[wdOf(d)]}, ${d.getUTCDate()} ${MON[d.getUTCMonth()]} · ${esc(lesson.time)}</div>
      ${ex().map(n=>`<div class="note ${n.done?'done':''}"><input type="checkbox" data-id="${n.id}" ${n.done?'checked':''} aria-label="Готово">
        <div class="tx">${n.hw?'<span class="tag">ДЗ</span>':''}${esc(n.text)}</div><button class="x" data-del="${n.id}" aria-label="Удалить">×</button></div>`).join('')}
      <textarea id="nt" placeholder="Заметка или домашнее задание"></textarea>
      <div class="row"><label><input type="checkbox" id="hw" checked> Это ДЗ</label><button class="btn" id="ad">Добавить</button></div></div>`;
    bg.querySelectorAll('.note input').forEach(c=>c.onchange=()=>{const n=notes.find(x=>x.id===c.dataset.id);if(n){n.done=c.checked;saveNotes();draw()}});
    bg.querySelectorAll('.x').forEach(b=>b.onclick=()=>{notes=notes.filter(x=>x.id!==b.dataset.del);saveNotes();draw()});
    bg.querySelector('#ad').onclick=()=>{
      const v=bg.querySelector('#nt').value;
      if(!v.trim()) return;
      addNote(lesson.subject,v,bg.querySelector('#hw').checked,iso); draw();
    };
  };
  bg.onclick=(e)=>{if(e.target===bg){bg.remove();render()}};
  draw(); document.body.appendChild(bg);
}

function render(){
  if(!token) return renderLogin();
  if(state.expired) return renderExpired();
  if(!data) { $('#app').innerHTML='<div class="screen"><h1>Загрузка…</h1><p>Получаем расписание.</p></div>'; return }
  state.tab==='notes'?renderNotes():renderSchedule();
}

// --- Запуск
(function init(){
  render(); sync();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
  window.addEventListener('online',sync);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
</script>
</body>
</html>
